name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/nextjs-docker-ec2
            git pull origin main
            docker system prune -af
            docker build --no-cache -t itasks .
            docker stop itasks 2>/dev/null || true
            docker rm itasks 2>/dev/null || true
            docker run -d \
              --name itasks \
              --restart always \
              -p 3000:3000 \
              itasks
            echo "✅ Deploy complete!"
